---
applications:
  - airlock-microgateway
  - cilium
  - gateway-api

parameters:
  # Dependency for testing with upstream lib
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-airlock-microgateway-operator/master/lib/airlock-microgateway-operator.libsonnet
        output_path: vendor/lib/airlock-microgateway-operator.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-gateway-api/master/lib/gateway-api.libsonnet
        output_path: vendor/lib/gateway-api.libsonnet
  airlock_microgateway:
    operatorNamespace: "test-operator-namespace"
    default:
      gateway:
        spec:
          gatewayClassName: test-default
          listeners:
            - allowedRoutes:
                namespaces:
                  from: All
              name: http
              port: 80
              protocol: HTTP
      backendTLSPolicyCNP:
        enabled: true
        sourceNamespace: shared-source
    instances:
      test-gateway-default-enabled: {}
      test-gateway-custom-source:
        backendTLSPolicyCNP:
          sourceNamespace: other-source
          apiVersion: gateway.networking.k8s.io/v1alpha1
      test-gateway-disabled:
        backendTLSPolicyCNP:
          enabled: false
