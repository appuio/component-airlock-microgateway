apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-world
  namespace: test-gateway-default-enabled
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: test-gateway-default-enabled
      microgateway.airlock.com/managedBy: test-operator-namespace
  ingress:
    - fromEntities:
        - world
