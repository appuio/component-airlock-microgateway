apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: microgateway-monitoring
  name: monitoring-dummy-backend
  namespace: vshn-airlock-monitoring
spec:
  minReadySeconds: 30
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: microgateway-monitoring
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app: microgateway-monitoring
    spec:
      containers:
        - image: ghcr.io/nginx/nginx-unprivileged:1.30.0-alpine3.23
          livenessProbe:
            httpGet:
              path: /health
              port: http
          name: nginx
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              memory: 50Mi
            requests:
              cpu: 10m
              memory: 10Mi
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/default.conf
              name: nginx-conf
              subPath: default.conf
      imagePullSecrets: []
      initContainers: []
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            name: nginx-conf
          name: nginx-conf
