apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    name: airlock-microgateway-rules
  name: airlock-microgateway-rules
  namespace: vshn-airlock-monitoring
spec:
  groups:
    - name: blackboxExporter
      rules:
        - alert: IngressUnavailable
          annotations:
            description: Http check failed on {{ $labels.gateway }}
            runbook_url: runbook.url
            summary: Http check failed
          expr: probe_success{gateway=~"vshn-test-.*"} != 1
          for: 5m
          keep_firing_for: 10m
          labels:
            severity: critical
            syn: 'true'
            syn_component: monitoring
    - name: sessionMonitoring
      rules:
        - alert: AirlockMicrogatewaySessionConnectionMonitoring
          annotations:
            description: '"Microgateway in {{ $labels.namespace }} has lost its connection
              to the SessionStore "'
            runbook_url: alert.rubook.com
            summary: Microgateway has lost its connection to the sessionStore (instance
              {{ $labels.instance }})
          expr: microgateway_session_store_connection_state{namespace="vshn-test"}
            != 1
          for: 2m
          keep_firing_for: 10m
          labels:
            severity: warning
            syn: 'true'
            syn_component: monitoring
