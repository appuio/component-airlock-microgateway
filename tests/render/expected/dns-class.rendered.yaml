---
- apiVersion: cilium.io/v2
  kind: CiliumNetworkPolicy
  metadata:
    annotations:
      espejote.io/source-service: external-backend
    labels:
      espejote.io/managed-resource: backendtlspolicy-cnp
    name: c29b21042dea9eac0e6a-external-backend
    namespace: test-gateway-default-enabled
  spec:
    egress:
    - toFQDNs:
      - matchName: eu.api.example.org
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP
        serverNames:
        - api.example.org
    endpointSelector:
      matchLabels:
        gateway.networking.k8s.io/gateway-name: test-gateway-default-enabled
- apiVersion: cilium.io/v2
  kind: CiliumNetworkPolicy
  metadata:
    annotations:
      espejote.io/source-service: loose-end
    labels:
      espejote.io/managed-resource: backendtlspolicy-cnp
    name: 46c0ef1fda413a403b89-loose-end
    namespace: test-gateway-default-enabled
  spec:
    egress:
    - toFQDNs:
      - matchName: stray.example.org
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP
        - port: "8443"
          protocol: TCP
    endpointSelector:
      matchLabels:
        gateway.networking.k8s.io/gateway-name: test-gateway-default-enabled
- apiVersion: cilium.io/v2
  kind: CiliumNetworkPolicy
  metadata:
    annotations:
      espejote.io/source-service: portless
    labels:
      espejote.io/managed-resource: backendtlspolicy-cnp
    name: 4455138c4b5ea68d9a4e-portless
    namespace: test-gateway-default-enabled
  spec:
    egress:
    - toFQDNs:
      - matchName: portless.example.org
    endpointSelector:
      matchLabels:
        gateway.networking.k8s.io/gateway-name: test-gateway-default-enabled
