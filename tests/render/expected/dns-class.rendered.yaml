---
- apiVersion: cilium.io/v2
  kind: CiliumNetworkPolicy
  metadata:
    annotations:
      espejote.io/source-service: external-backend
    labels:
      espejote.io/managed-resource: backendtlspolicy-cnp
    name: a580b80c8f893491e202
    namespace: test-gateway-default-enabled
  spec:
    egress:
    - toFQDNs:
      - matchName: eu.api.example.org
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP
        serverNames:
        - api.example.org
    endpointSelector:
      matchLabels:
        gateway.networking.k8s.io/gateway-name: test-gateway-default-enabled
- apiVersion: cilium.io/v2
  kind: CiliumNetworkPolicy
  metadata:
    annotations:
      espejote.io/source-service: loose-end
    labels:
      espejote.io/managed-resource: backendtlspolicy-cnp
    name: 247110cd075e67fa8cb3
    namespace: test-gateway-default-enabled
  spec:
    egress:
    - toFQDNs:
      - matchName: stray.example.org
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP
        - port: "8443"
          protocol: TCP
    endpointSelector:
      matchLabels:
        gateway.networking.k8s.io/gateway-name: test-gateway-default-enabled
- apiVersion: cilium.io/v2
  kind: CiliumNetworkPolicy
  metadata:
    annotations:
      espejote.io/source-service: portless
    labels:
      espejote.io/managed-resource: backendtlspolicy-cnp
    name: 39433b7dc1d5eebab879
    namespace: test-gateway-default-enabled
  spec:
    egress:
    - toFQDNs:
      - matchName: portless.example.org
    endpointSelector:
      matchLabels:
        gateway.networking.k8s.io/gateway-name: test-gateway-default-enabled
