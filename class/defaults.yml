parameters:
  airlock_microgateway:
    =_metadata:
      multi_tenant: true
      multi_instance: true
      multi_version: true

    debug: false

    images:
      nginx:
        registry: 'ghcr.io'
        repository: 'nginx/nginx-unprivileged'
        tag: '1.30.0-alpine3.23'


    monitoring:
      enabled: false
      namespace: {}
      sessionMonitoring:
        enabled: false
      blackboxExporter:
        enabled: false
      dummyBackend:
        enabled: false

    operatorNamespace: ""
    default:
      namespace:
        labels: {}
        annotations: {}
      gateway: {}
      gatewayParameters:
        spec:
          kubernetes:
            deployment:
              replicas: 2
      pdb: {}
      redisProvider: {}
      sessionHandling: {}
      egressNetpol: {}
      httpRedirect: {}
      customResponses: {}
    instances: {}
